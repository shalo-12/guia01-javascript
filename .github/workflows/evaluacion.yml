name: Guía 01 - verificación de JavaScript
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        run: npm test
